<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="120" y1="120" x2="392" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <radialGradient id="bgSphere" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="70%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bgSphere)" />
  <rect width="510" height="510" x="1" y="1" rx="127" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Background subtle grid glow -->
  <circle cx="256" cy="256" r="140" fill="url(#primaryGrad)" opacity="0.15" filter="url(#glow)" />

  <!-- Hexagonal Tech Shield Ring -->
  <path
    d="M 256,96 L 396,176 L 396,336 L 256,416 L 116,336 L 116,176 Z"
    stroke="url(#primaryGrad)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="url(#innerGlow)"
  />

  <!-- Outer Orbit Nodes -->
  <circle cx="256" cy="96" r="10" fill="#67E8F9" />
  <circle cx="396" cy="176" r="8" fill="#A5B4FC" />
  <circle cx="396" cy="336" r="8" fill="#818CF8" />
  <circle cx="256" cy="416" r="10" fill="#6366F1" />
  <circle cx="116" cy="336" r="8" fill="#818CF8" />
  <circle cx="116" cy="176" r="8" fill="#A5B4FC" />

  <!-- Dynamic TaskRequest Tech Mark -->
  <path
    d="M 180,310 L 256,160 L 332,310"
    stroke="white"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Crossbar bridging the Chevron (Forming Control Dashboard Dial) -->
  <path
    d="M 200,265 L 312,265"
    stroke="url(#primaryGrad)"
    stroke-width="18"
    stroke-linecap="round"
  />

  <!-- Glowing Core Nexus Node (Control Center) -->
  <circle cx="256" cy="225" r="22" fill="#06B6D4" filter="url(#glow)" />
  <circle cx="256" cy="225" r="14" fill="#FFFFFF" />

  <!-- Speed tick accents on the apex -->
  <line x1="256" y1="128" x2="256" y2="148" stroke="#67E8F9" stroke-width="6" stroke-linecap="round" />
</svg>